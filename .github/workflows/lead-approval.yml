name: Lead approval

# Caller: the logic lives in zedu-hng/zedu-ci (lead-approval.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Sets "Lead approved" once one of the PR's team leads approves (or a reviewer adds lead-verified).
# The relay and the sweep dispatch this file with `pr` and `base_ref`.

on:
  pull_request_target:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to re-check
        required: true
      base_ref:
        description: Branch the pull request targets
        required: true
  schedule:
    - cron: "*/5 * * * *"

permissions: {}

# Labels Lead approval doesn't read get a group of their own, so adding one can't cancel a check.
concurrency:
  group: >-
    lead-approval-${{
      (contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) &&
       !contains(fromJSON('["lead-verified", "sync", "hotfix"]'), github.event.label.name) &&
       format('label-{0}', github.run_id))
      || github.event.pull_request.number || inputs.pr || github.run_id }}
  cancel-in-progress: true

jobs:
  approval:
    name: Lead approval
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    uses: zedu-hng/zedu-ci/.github/workflows/lead-approval.yml@ed2c2cdb27717ae5fa31cb45f49dd2f31dc86837
