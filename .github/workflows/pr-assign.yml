name: PR assign

# Caller: the logic lives in zedu-hng/zedu-ci (pr-assign.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Assigns a contributor PR to its author; reviewers claim with the `claimed` label, not the assignee.

on:
  pull_request_target:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: pr-assign-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assign:
    name: PR assign
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: zedu-hng/zedu-ci/.github/workflows/pr-assign.yml@42c819ef031776418c05c47f5d0ed453ff048870
