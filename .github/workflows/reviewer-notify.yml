name: Reviewer notify

# Caller: the logic lives in zedu-hng/zedu-ci (reviewer-notify.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Keeps the ready-for-review queue: lead-approved PRs with a green Build, up to the `cap` input (default 5) unclaimed per team.

on:
  pull_request_target:
    branches:
      - dev
      - central-staging
    types:
      - ready_for_review
      - labeled
      - unlabeled
      - synchronize
      - reopened
      - converted_to_draft
      - closed
  workflow_run:
    workflows: ["Lead approval", "PR Review comment"]
    types:
      - completed
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

# Every run re-evaluates the whole queue, so runs share one group without cancelling. The Build status
# is written by PR Review comment (a status write fires no event), so that workflow finishing is the trigger.
concurrency:
  group: reviewer-notify
  cancel-in-progress: false

jobs:
  notify:
    name: Reviewer notify
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    uses: zedu-hng/zedu-ci/.github/workflows/reviewer-notify.yml@181371c60af0e32605794c6f0c4520f1ef739271
    with:
      build_context: Build
