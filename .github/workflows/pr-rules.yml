name: PR rules

# Caller: the logic lives in zedu-hng/zedu-ci (pr-rules.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Branch name, Single author, Protected files, Size, PR title and PR template, each a commit status.

on:
  pull_request_target:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled

permissions: {}

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules:
    name: PR rules
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: zedu-hng/zedu-ci/.github/workflows/pr-rules.yml@42c819ef031776418c05c47f5d0ed453ff048870
    with:
      protected: '^(\.github/|AGENTS\.md$|CONTRIBUTING\.md$|components\.json$|eslint\.config\.mjs$|\.prettierrc$|\.prettierignore$|tsconfig\.json$|next\.config\.mjs$|postcss\.config\.|tailwind\.config\.|commitlint\.config|\.gitleaks\.toml$|\.semgrepignore$|\.husky/|\.npmrc$)'
      size_exclude: '(^|/)(pnpm-lock\.yaml|package-lock\.json|yarn\.lock)$|\.tsbuildinfo$'
      template: .github/pull_request_template.md
