name: PR Review recheck

# Caller: the logic lives in zedu-hng/zedu-ci (pr-review-recheck.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# After a push to dev or central-staging, re-runs PR checks for open PRs whose only failure is PR review.

on:
  push:
    branches:
      - dev
      - central-staging
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-review-recheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recheck:
    name: PR Review recheck
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      actions: write
      pull-requests: read
    uses: zedu-hng/zedu-ci/.github/workflows/pr-review-recheck.yml@ed2c2cdb27717ae5fa31cb45f49dd2f31dc86837
