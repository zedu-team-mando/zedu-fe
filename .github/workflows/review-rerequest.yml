name: Review re-request

# Caller: the logic lives in zedu-hng/zedu-ci (review-rerequest.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Re-requests the lead's review when the author pushes onto a changes-requested PR.

on:
  pull_request_target:
    branches:
      - dev
      - central-staging
    types:
      - synchronize

permissions: {}

concurrency:
  group: review-rerequest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rerequest:
    name: Review re-request
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: zedu-hng/zedu-ci/.github/workflows/review-rerequest.yml@42c819ef031776418c05c47f5d0ed453ff048870
