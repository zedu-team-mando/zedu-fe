name: Reviewer claim

# Caller: the logic lives in zedu-hng/zedu-ci (reviewer-claim.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# /claim and /release on PRs in the ready-for-review queue, plus the 24h escalation sweep.

on:
  issue_comment:
    types:
      - created
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reviewer-claim-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claim:
    name: Reviewer claim
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: zedu-hng/zedu-ci/.github/workflows/reviewer-claim.yml@f2969e20da08dc048157da6e19265141c0c3e231
