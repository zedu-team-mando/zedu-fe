name: PR scans

# Caller: the logic lives in zedu-hng/zedu-ci (pr-scans.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Replaces the Semgrep part of Zedu's Security checks and the ClamAV part of Malware scan (disabled in
# zedu-hng; their files stay as upstream). Same rule packs, paths and excludes.

on:
  pull_request:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: pr-scans-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scans:
    name: PR scans
    if: github.repository == 'zedu-hng/zedu-fe'
    permissions:
      contents: read
    uses: zedu-hng/zedu-ci/.github/workflows/pr-scans.yml@f2969e20da08dc048157da6e19265141c0c3e231
    with:
      semgrep_configs: p/typescript p/react p/nextjs p/security-audit
      semgrep_paths: src
      clamav_exclude_dirs: node_modules .next
