name: Team routing

# Caller: the logic lives in zedu-hng/zedu-ci (team-routing.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Requests review from the PR's team leads (zedu-ci teams.yml).

on:
  pull_request_target:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - ready_for_review
      - reopened

permissions: {}

concurrency:
  group: team-routing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    name: Team routing
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: zedu-hng/zedu-ci/.github/workflows/team-routing.yml@ed2c2cdb27717ae5fa31cb45f49dd2f31dc86837
