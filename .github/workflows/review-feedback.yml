name: Review feedback

# Caller: the logic lives in zedu-hng/zedu-ci (review-feedback.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Sets/clears changes-requested and mentions the author and leads when a review requests changes.

on:
  workflow_run:
    workflows: ["Lead approval review"]
    types:
      - completed

permissions: {}

jobs:
  feedback:
    name: Review feedback
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: zedu-hng/zedu-ci/.github/workflows/review-feedback.yml@ed2c2cdb27717ae5fa31cb45f49dd2f31dc86837
