name: Fork gate

# Caller: the logic lives in zedu-hng/zedu-ci (fork-gate.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Closes a PR opened from a personal-account fork; org forks (registered or not) are left open.

on:
  pull_request_target:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - reopened

permissions: {}

concurrency:
  group: fork-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Fork gate
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: zedu-hng/zedu-ci/.github/workflows/fork-gate.yml@181371c60af0e32605794c6f0c4520f1ef739271
