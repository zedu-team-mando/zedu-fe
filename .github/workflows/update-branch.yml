name: Update branch

# Caller: the logic lives in zedu-hng/zedu-ci (update-branch.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Updates behind PR branches; nudges the author and leads when the token can't push to the fork.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

# Re-evaluates every PR in one sweep, so runs share one group without cancelling.
concurrency:
  group: update-branch
  cancel-in-progress: false

jobs:
  update:
    name: Update branch
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: zedu-hng/zedu-ci/.github/workflows/update-branch.yml@42c819ef031776418c05c47f5d0ed453ff048870
